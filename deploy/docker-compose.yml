services:
  self-modifying-bot:
    build:
      context: ..
    image: self-modifying-bot:latest
    container_name: self-modifying-bot
    restart: unless-stopped
    env_file:
      - ${BOT_CONFIG_DIR:-/var/lib/self_modifying_bot}/.env
    environment:
      SELF_MODIFYING_BOT_HOME: /var/lib/self_modifying_bot
    ports:
      - "127.0.0.1:${BOT_PORT:-8000}:8000"
    volumes:
      - ${BOT_CONFIG_DIR:-/var/lib/self_modifying_bot}:/var/lib/self_modifying_bot
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
